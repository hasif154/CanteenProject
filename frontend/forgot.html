<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sathyabama Canteen - Reset Your Password">
    <title>Reset Password - Sathyabama Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Success message — mirrors existing error-message pattern */
        .success-message {
            display: none;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md);
            background: var(--success-light);
            border: 1px solid var(--success);
            border-radius: var(--radius-lg);
            color: #166534;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .success-message.show {
            display: flex;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color var(--transition-fast);
        }

        .back-link:hover {
            color: white;
        }

        .password-requirements {
            font-size: 0.75rem;
            color: var(--gray-400);
            margin-top: 4px;
        }
    </style>
</head>

<body class="login-page">
    <!-- Background with blur and overlay -->
    <div class="login-background">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
    </div>

    <div class="login-container">
        <!-- Logo & Branding -->
        <div class="brand-section">
            <div class="logo-container">
                <div class="logo-icon">
                    <span class="logo-emoji">🔑</span>
                </div>
                <h1 class="brand-name">Reset Password</h1>
                <p class="brand-tagline">Sathyabama Canteen</p>
            </div>
        </div>

        <!-- Reset Card -->
        <div class="login-card glass-card">
            <div class="card-header">
                <h2>Forgot Password?</h2>
                <p>Enter your Register Number and set a new password</p>
            </div>

            <form id="forgotForm" class="login-form">
                <div class="input-group">
                    <label for="regNo">Register Number</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🎓</span>
                        <input type="text" id="regNo" name="regNo" placeholder="e.g., 43613001"
                            required autocomplete="off" minlength="5">
                    </div>
                </div>

                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password"
                            required minlength="4">
                    </div>
                    <span class="password-requirements">Minimum 4 characters</span>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm new password" required minlength="4">
                    </div>
                </div>

                <!-- Error Message -->
                <div class="error-message" id="errorMessage">
                    <span class="error-icon">⚠️</span>
                    <span class="error-text">Something went wrong</span>
                </div>

                <!-- Success Message -->
                <div class="success-message" id="successMessage">
                    <span class="success-icon">✅</span>
                    <span class="success-text">Password updated successfully!</span>
                </div>

                <button type="submit" class="btn-primary btn-large" id="resetBtn">
                    <span class="btn-text">Reset Password</span>
                    <span class="btn-icon">🔑</span>
                </button>
            </form>
        </div>

        <!-- Back to Login -->
        <div style="text-align:center; margin-top: var(--space-md);">
            <a href="/" class="back-link">
                ← Back to Login
            </a>
        </div>
    </div>

    <script src="js/forgot.js"></script>
</body>

</html>
