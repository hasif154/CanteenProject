<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sathyabama Canteen - Online Food Ordering System">
    <title>Sathyabama Canteen - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>

<body class="login-page">
    <!-- Background with blur and overlay -->
    <div class="login-background">
        <div class="bg-image"></div>
        <div class="bg-overlay"></div>
    </div>

    <div class="login-container">
        <!-- Logo & Branding -->
        <div class="brand-section">
            <div class="logo-container">
                <div class="logo-icon">
                    <span class="logo-emoji">🍽️</span>
                </div>
                <h1 class="brand-name">Sathyabama Canteen</h1>
                <p class="brand-tagline">Online Vending System</p>
            </div>
        </div>

        <!-- Login Card -->
        <div class="login-card glass-card">
            <div class="card-header">
                <h2>Student Login</h2>
                <p>Enter your Register Number to continue</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="registerNumber">Register Number</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🎓</span>
                        <input type="text" id="registerNumber" name="registerNumber" placeholder="e.g., 43613001"
                            required autocomplete="off" minlength="5">
                    </div>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="••••" required>
                    </div>
                </div>

                <!-- Error Message -->
                <div class="error-message" id="errorMessage">
                    <span class="error-icon">⚠️</span>
                    <span class="error-text">Login During You're Lunch Time</span>
                </div>

                <button type="submit" class="btn-primary btn-large" id="loginBtn">
                    <span class="btn-text">Login</span>
                    <span class="btn-icon">→</span>
                </button>
            </form>
        </div>

        <!-- Features Section -->
        <div class="features-section">
            <div class="feature-item">
                <span class="feature-icon">⚡</span>
                <span class="feature-text">Quick Order</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">📱</span>
                <span class="feature-text">Digital Receipt</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🎯</span>
                <span class="feature-text">Skip Queue</span>
            </div>
        </div>
    </div>

    <script>
        // Check if already logged in
        const storedRegNo = localStorage.getItem('registerNumber');
        const storedName = localStorage.getItem('studentName');
        if (storedRegNo && storedName) {
            window.location.href = '/menu';
        }

        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const registerNumber = document.getElementById('registerNumber').value.trim().toUpperCase();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const errorText = errorMessage.querySelector('.error-text');
            const submitBtn = document.getElementById('loginBtn');

            // Hide any previous error
            errorMessage.classList.remove('show');

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-text">Logging in...</span><span class="btn-loader"></span>';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        registerNumber: registerNumber,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // Store in localStorage
                    localStorage.setItem('registerNumber', data.registerNumber);
                    localStorage.setItem('studentName', data.name);

                    // Redirect
                    window.location.href = '/menu';
                } else {
                    // Show error from backend
                    errorText.textContent = data.message || "Login During You're Lunch Time";
                    errorMessage.classList.add('show');

                    // Shake animation
                    errorMessage.classList.add('shake');
                    setTimeout(() => errorMessage.classList.remove('shake'), 500);

                    // Reset button
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span class="btn-text">Login</span><span class="btn-icon">→</span>';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = "Connection failed. Please try again.";
                errorMessage.classList.add('show');

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span class="btn-text">Login</span><span class="btn-icon">→</span>';
            }
        });

        // Clear error on input
        document.getElementById('registerNumber').addEventListener('input', () => {
            document.getElementById('errorMessage').classList.remove('show');
        });
    </script>
</body>

</html>
