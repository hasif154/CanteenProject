<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and order delicious food from Sathyabama Canteen">
    <title>Menu - Sathyabama Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="menu-page">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <a href="/select-canteen" class="back-link" title="Change Canteen">
                    <span class="back-arrow">←</span>
                </a>
                <div class="header-logo-icon">🍽️</div>
                <span class="header-title" id="canteenTitle">Loading...</span>
            </div>
            <div class="user-info" id="userInfo">
                <span class="icon">🎓</span>
                <span id="userDisplay">Loading...</span>
            </div>
        </div>
    </header>

    <!-- Live Status Banner -->
    <div class="live-banner" id="liveBanner">
        <span class="live-dot"></span>
        <span>Live Menu • Auto-refreshing</span>
    </div>

    <!-- Search Bar + Veg Toggle -->
    <div class="menu-search-bar">
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="menuSearchInput" placeholder="Search food items..." autocomplete="off">
            <button class="search-clear hidden" id="searchClear">✕</button>
        </div>
        <div class="veg-toggle-container">
            <span class="veg-toggle-label">🥬 Veg Only</span>
            <label class="veg-toggle-switch">
                <input type="checkbox" id="vegToggle">
                <span class="veg-toggle-slider"></span>
            </label>
        </div>
    </div>

    <!-- Category Tabs -->
    <nav class="category-tabs">
        <div class="tabs-container" id="categoryTabs">
            <button class="tab-btn active" data-category="all">All Items</button>
            <button class="tab-btn" data-category="Main Course">🍛 Main Course</button>
            <button class="tab-btn" data-category="Snacks">🥪 Snacks</button>
            <button class="tab-btn" data-category="Chaat">🥟 Chaat</button>
            <button class="tab-btn" data-category="Desserts">🍦 Desserts</button>
        </div>
    </nav>

    <!-- Menu Grid -->
    <main class="menu-section">
        <div class="menu-grid" id="menuGrid">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div class="floating-cart hidden" id="floatingCart">
        <div class="cart-bar">
            <div class="cart-info">
                <span class="cart-count" id="cartCount">0</span>
                <div class="cart-total">
                    <span>Total:</span>
                    ₹<span id="cartTotal">0</span>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn">
                <span>Place Order</span>
                <span>→</span>
            </button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal-overlay" id="cartModal">
        <div class="cart-modal">
            <div class="modal-header">
                <h3>🛒 Your Order</h3>
                <button class="close-modal" id="closeModal">×</button>
            </div>
            <div class="modal-body">
                <div class="cart-items" id="cartItems">
                    <!-- Cart items will be rendered here -->
                </div>
            </div>
            <div class="modal-footer">
                <div class="order-summary">
                    <span class="label">Total Amount</span>
                    <span class="total">₹<span id="modalTotal">0</span></span>
                </div>
                <button class="btn-primary btn-large" id="placeOrderBtn">
                    <span class="btn-text">✓ Place Order</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Menu Update Toast -->
    <div class="menu-toast" id="menuToast">
        <span>🔄</span> Menu updated by admin
    </div>

    <script src="js/menu.js"></script>

    <style>
        /* Back link in header */
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            text-decoration: none;
            color: white;
            font-size: 1.125rem;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Live Banner */
        .live-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            padding: var(--space-xs) var(--space-md);
            background: linear-gradient(90deg, #065f46, #047857);
            color: #a7f3d0;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            animation: livePulse 2s ease-in-out infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5);
            }

            50% {
                opacity: 0.7;
                box-shadow: 0 0 0 6px rgba(52, 211, 153, 0);
            }
        }

        /* Sold Out Styles */
        .food-card.sold-out {
            opacity: 0.65;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .food-card.sold-out .food-card-body {
            opacity: 0.7;
        }

        .sold-out-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .sold-out-overlay span {
            background: var(--error);
            color: white;
            padding: var(--space-xs) var(--space-lg);
            border-radius: var(--radius-full);
            font-size: 0.8125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .unavailable-tag {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--error);
            padding: var(--space-xs) var(--space-sm);
            background: var(--error-light);
            border-radius: var(--radius-full);
        }

        /* Menu Update Toast */
        .menu-toast {
            position: fixed;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-900);
            color: white;
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: var(--shadow-xl);
            transition: top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }

        .menu-toast.show {
            top: var(--space-lg);
        }

        /* Mobile header adjustments */
        @media (max-width: 480px) {
            .header-logo {
                gap: var(--space-xs);
            }

            .back-link {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }

            .header-logo-icon {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }
        }

        /* Search Bar */
        .menu-search-bar {
            padding: var(--space-sm) var(--space-lg);
            background: var(--gray-50);
        }

        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            font-size: 1rem;
            pointer-events: none;
            z-index: 1;
        }

        .search-container input {
            width: 100%;
            padding: 10px 40px 10px 42px;
            font-size: 0.9375rem;
            font-family: inherit;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-full);
            background: white;
            color: var(--gray-900);
            outline: none;
            transition: all var(--transition-fast);
        }

        .search-container input:focus {
            border-color: var(--primary-500);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-container input::placeholder {
            color: var(--gray-400);
        }

        .search-clear {
            position: absolute;
            right: 10px;
            width: 28px;
            height: 28px;
            border: none;
            background: var(--gray-200);
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }

        .search-clear:hover {
            background: var(--gray-300);
        }

        .search-clear.hidden {
            display: none;
        }

        /* Veg Toggle */
        .menu-search-bar {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .veg-toggle-container {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .veg-toggle-label {
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--gray-600);
        }

        .veg-toggle-switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
        }

        .veg-toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .veg-toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--gray-300);
            transition: 0.3s;
            border-radius: 24px;
        }

        .veg-toggle-slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
            box-shadow: var(--shadow-sm);
        }

        .veg-toggle-switch input:checked+.veg-toggle-slider {
            background-color: #16a34a;
        }

        .veg-toggle-switch input:checked+.veg-toggle-slider::before {
            transform: translateX(20px);
        }

        /* Veg/Non-Veg Badge on food cards */
        .food-veg-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 3;
            width: 18px;
            height: 18px;
            border: 2px solid;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }

        .food-veg-badge.veg {
            border-color: #16a34a;
        }

        .food-veg-badge.nonveg {
            border-color: #dc2626;
        }

        .food-veg-badge::after {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .food-veg-badge.veg::after {
            background: #16a34a;
        }

        .food-veg-badge.nonveg::after {
            border-radius: 0;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 7px solid #dc2626;
        }

        @media (max-width: 480px) {
            .menu-search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .veg-toggle-container {
                justify-content: flex-end;
            }
        }
    </style>
</body>

</html>
