<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and order delicious food from Sathyabama Canteen">
    <title>Menu - Sathyabama Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>

<body class="menu-page">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <div class="header-logo-icon">🍽️</div>
                <span class="header-title">Sathyabama Canteen</span>
            </div>
            <div class="user-info" id="userInfo">
                <span class="icon">🎓</span>
                <span id="userDisplay">Loading...</span>
            </div>
        </div>
    </header>

    <!-- Category Tabs -->
    <nav class="category-tabs">
        <div class="tabs-container" id="categoryTabs">
            <button class="tab-btn active" data-category="all">All Items</button>
            <button class="tab-btn" data-category="Snacks">🥟 Snacks</button>
            <button class="tab-btn" data-category="Quick Meals">🍽️ Quick Meals</button>
            <button class="tab-btn" data-category="Beverages">🥤 Beverages</button>
        </div>
    </nav>

    <!-- Menu Grid -->
    <main class="menu-section">
        <div class="menu-grid" id="menuGrid">
            <!-- Food cards will be loaded here -->
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- Floating Cart Bar -->
    <div class="floating-cart hidden" id="floatingCart">
        <div class="cart-bar">
            <div class="cart-info">
                <span class="cart-count" id="cartCount">0</span>
                <div class="cart-total">
                    <span>Total:</span>
                    ₹<span id="cartTotal">0</span>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn">
                <span>Place Order</span>
                <span>→</span>
            </button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div class="modal-overlay" id="cartModal">
        <div class="cart-modal">
            <div class="modal-header">
                <h3>🛒 Your Order</h3>
                <button class="close-modal" id="closeModal">×</button>
            </div>
            <div class="modal-body">
                <div class="cart-items" id="cartItems">
                    <!-- Cart items will be rendered here -->
                </div>
            </div>
            <div class="modal-footer">
                <div class="order-summary">
                    <span class="label">Total Amount</span>
                    <span class="total">₹<span id="modalTotal">0</span></span>
                </div>
                <button class="btn-primary btn-large" id="placeOrderBtn">
                    <span class="btn-text">✓ Place Order</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // State Management
        // ============================================
        let menuItems = [];
        let cart = {};
        let registerNumber = '';
        let studentName = '';
        let currentCategory = 'all';

        // ============================================
        // Initialization
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            // Check if logged in
            registerNumber = localStorage.getItem('registerNumber');
            studentName = localStorage.getItem('studentName');

            if (!registerNumber || !studentName) {
                window.location.href = '/';
                return;
            }

            // Display user info: REGISTER_NUMBER – STUDENT_NAME
            document.getElementById('userDisplay').textContent = `${registerNumber} – ${studentName}`;

            // Load cart from session
            const savedCart = localStorage.getItem('cart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }

            // Fetch menu
            fetchMenu();

            // Set up event listeners
            setupEventListeners();
        });

        // ============================================
        // API Functions
        // ============================================
        async function fetchMenu() {
            try {
                const response = await fetch('/api/menu');
                const data = await response.json();

                if (data.success) {
                    menuItems = data.menu;
                    renderMenu();
                    updateCartUI();
                }
            } catch (error) {
                console.error('Error fetching menu:', error);
                document.getElementById('menuGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">😕</div>
                        <h3>Failed to load menu</h3>
                        <p>Please refresh the page to try again</p>
                    </div>
                `;
            }
        }

        async function createOrder() {
            const items = Object.entries(cart).map(([id, qty]) => ({
                menu_item_id: id,
                quantity: qty
            }));

            try {
                const response = await fetch('/api/order/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        student_id: registerNumber,
                        student_name: studentName,
                        items: items
                    })
                });

                const data = await response.json();
                return data;
            } catch (error) {
                console.error('Error creating order:', error);
                return { success: false, error: 'Connection error' };
            }
        }

        // ============================================
        // Rendering Functions
        // ============================================
        function renderMenu() {
            const grid = document.getElementById('menuGrid');
            const filteredItems = currentCategory === 'all'
                ? menuItems
                : menuItems.filter(item => item.category === currentCategory);

            if (filteredItems.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🍽️</div>
                        <h3>No items found</h3>
                        <p>Try selecting a different category</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredItems.map(item => `
                <div class="food-card ${cart[item.id] ? 'in-cart' : ''}" data-id="${item.id}">
                    <div class="food-image-container">
                        <img 
                            class="food-image" 
                            src="${item.image}" 
                            alt="${item.name}"
                            loading="lazy"
                            onerror="this.src='https://placehold.co/300x200?text=${encodeURIComponent(item.emoji)}'"
                        >
                        <span class="food-emoji">${item.emoji}</span>
                    </div>
                    <div class="food-card-body">
                        <h3 class="food-name">${item.name}</h3>
                        <p class="food-price">₹${item.price}</p>
                        <div class="food-actions">
                            ${cart[item.id] ? `
                                <div class="qty-controls">
                                    <button class="qty-btn" data-action="decrease" data-id="${item.id}">−</button>
                                    <span class="qty-value">${cart[item.id]}</span>
                                    <button class="qty-btn" data-action="increase" data-id="${item.id}">+</button>
                                </div>
                            ` : `
                                <button class="add-btn" data-action="add" data-id="${item.id}">+ Add</button>
                            `}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderCartModal() {
            const cartItemsContainer = document.getElementById('cartItems');
            const cartEntries = Object.entries(cart);

            if (cartEntries.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Add some delicious items!</p>
                    </div>
                `;
                return;
            }

            cartItemsContainer.innerHTML = cartEntries.map(([id, qty]) => {
                const item = menuItems.find(m => m.id === id);
                if (!item) return '';

                return `
                    <div class="cart-item">
                        <span class="cart-item-emoji">${item.emoji}</span>
                        <div class="cart-item-details">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">₹${item.price} × ${qty}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" data-action="decrease" data-id="${id}">−</button>
                            <span class="qty-value">${qty}</span>
                            <button class="qty-btn" data-action="increase" data-id="${id}">+</button>
                        </div>
                        <span class="cart-item-total">₹${item.price * qty}</span>
                    </div>
                `;
            }).join('');
        }

        function updateCartUI() {
            const cartEntries = Object.entries(cart);
            const totalItems = cartEntries.reduce((sum, [, qty]) => sum + qty, 0);
            const totalAmount = cartEntries.reduce((sum, [id, qty]) => {
                const item = menuItems.find(m => m.id === id);
                return sum + (item ? item.price * qty : 0);
            }, 0);

            // Update floating cart
            const floatingCart = document.getElementById('floatingCart');
            if (totalItems > 0) {
                floatingCart.classList.remove('hidden');
                document.getElementById('cartCount').textContent = totalItems;
                document.getElementById('cartTotal').textContent = totalAmount;
            } else {
                floatingCart.classList.add('hidden');
            }

            // Update modal total
            document.getElementById('modalTotal').textContent = totalAmount;

            // Save cart to localStorage
            localStorage.setItem('cart', JSON.stringify(cart));

            // Re-render menu to update cart states
            renderMenu();
            renderCartModal();
        }

        // ============================================
        // Cart Functions
        // ============================================
        function addToCart(itemId) {
            cart[itemId] = (cart[itemId] || 0) + 1;
            updateCartUI();
        }

        function increaseQty(itemId) {
            if (cart[itemId]) {
                cart[itemId]++;
                updateCartUI();
            }
        }

        function decreaseQty(itemId) {
            if (cart[itemId]) {
                cart[itemId]--;
                if (cart[itemId] <= 0) {
                    delete cart[itemId];
                }
                updateCartUI();
            }
        }

        // ============================================
        // Order Placement
        // ============================================
        async function handlePlaceOrder() {
            const placeOrderBtn = document.getElementById('placeOrderBtn');
            placeOrderBtn.disabled = true;
            placeOrderBtn.innerHTML = '<span class="btn-text">Processing...</span><span class="btn-loader"></span>';

            try {
                // 1. Create Order (Pending state)
                const orderResult = await createOrder();

                if (!orderResult.success) {
                    throw new Error(orderResult.error || 'Failed to create order');
                }

                const order = orderResult.order;

                // 2. Initiate Payment
                const paymentResponse = await fetch('/api/payment/initiate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ order_id: order.id })
                });

                const paymentData = await paymentResponse.json();

                if (!paymentData.success) {
                    throw new Error(paymentData.error || 'Failed to initiate payment');
                }

                // 3. Open Razorpay Checkout
                const options = {
                    key: paymentData.razorpay_key_id,
                    amount: paymentData.amount,
                    currency: paymentData.currency,
                    name: "Sathyabama Canteen",
                    description: "Food Order #" + order.id.toUpperCase(),
                    image: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Samosa-Indian.jpg/1280px-Samosa-Indian.jpg", // Logo
                    // order_id: paymentData.razorpay_order_id, // Commented out for Demo Mode (Self-hosted order IDs)
                    handler: async function (response) {
                        try {
                            // 4. Verify Payment
                            const verifyResponse = await fetch('/api/payment/verify', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    order_id: order.id,
                                    razorpay_payment_id: response.razorpay_payment_id,
                                    razorpay_order_id: response.razorpay_order_id,
                                    razorpay_signature: response.razorpay_signature
                                })
                            });

                            const verifyData = await verifyResponse.json();

                            if (verifyData.success) {
                                // 5. Success! Redirect to receipt
                                cart = {};
                                localStorage.removeItem('cart');
                                localStorage.setItem('lastOrderId', order.id);
                                localStorage.setItem('lastOrder', JSON.stringify(verifyData.order));
                                window.location.href = '/receipt?order_id=' + order.id;
                            } else {
                                alert('Payment verification failed: ' + verifyData.error);
                            }
                        } catch (err) {
                            console.error('Verification error:', err);
                            alert('Payment verification failed. Please contact support.');
                        }
                    },
                    prefill: paymentData.prefill,
                    theme: {
                        color: "#1e3a8a"
                    },
                    modal: {
                        ondismiss: function () {
                            placeOrderBtn.disabled = false;
                            placeOrderBtn.innerHTML = '<span class="btn-text">✓ Place Order</span>';
                            alert('Payment cancelled. Please try again.');
                        }
                    }
                };

                const rzp1 = new Razorpay(options);
                rzp1.open();

            } catch (error) {
                console.error('Order processing error:', error);
                alert('Debug Error: ' + (error.message || 'An error occurred. Please try again.'));
                placeOrderBtn.disabled = false;
                placeOrderBtn.innerHTML = '<span class="btn-text">✓ Place Order</span>';
            }
        }

        // ============================================
        // Event Listeners
        // ============================================
        function setupEventListeners() {
            // Category tabs
            document.getElementById('categoryTabs').addEventListener('click', (e) => {
                if (e.target.classList.contains('tab-btn')) {
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.dataset.category;
                    renderMenu();
                }
            });

            // Menu grid click delegation
            document.getElementById('menuGrid').addEventListener('click', (e) => {
                const target = e.target;

                if (target.dataset.action === 'add') {
                    addToCart(target.dataset.id);
                } else if (target.dataset.action === 'increase') {
                    increaseQty(target.dataset.id);
                } else if (target.dataset.action === 'decrease') {
                    decreaseQty(target.dataset.id);
                }
            });

            // Cart modal click delegation
            document.getElementById('cartItems').addEventListener('click', (e) => {
                const target = e.target;

                if (target.dataset.action === 'increase') {
                    increaseQty(target.dataset.id);
                } else if (target.dataset.action === 'decrease') {
                    decreaseQty(target.dataset.id);
                }
            });

            // Open cart modal
            document.getElementById('checkoutBtn').addEventListener('click', () => {
                renderCartModal();
                document.getElementById('cartModal').classList.add('active');
            });

            // Close cart modal
            document.getElementById('closeModal').addEventListener('click', () => {
                document.getElementById('cartModal').classList.remove('active');
            });

            // Close modal on overlay click
            document.getElementById('cartModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    e.currentTarget.classList.remove('active');
                }
            });

            // Place Order button
            document.getElementById('placeOrderBtn').addEventListener('click', handlePlaceOrder);

            // User info click - logout option
            document.getElementById('userInfo').addEventListener('click', () => {
                if (confirm('Do you want to logout?')) {
                    localStorage.clear();
                    window.location.href = '/';
                }
            });
        }
    </script>
</body>

</html>
