<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your order history and dashboard - Sathyabama Canteen">
    <title>My Orders - Sathyabama Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>

<body class="dashboard-page">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <a href="/select-canteen" class="back-link" title="Back to Canteens">
                    <span class="back-arrow">←</span>
                </a>
                <div class="header-logo-icon">🍽️</div>
                <span class="header-title">My Orders</span>
            </div>
            <div class="user-info" id="userInfo" style="cursor:pointer;" title="Click to logout">
                <span class="icon">🎓</span>
                <span id="userDisplay">Loading...</span>
            </div>
        </div>
    </header>

    <!-- Dashboard Stats -->
    <section class="dash-stats-section">
        <div class="dash-stats-grid">
            <div class="dash-stat-card" id="statTotal">
                <div class="dash-stat-icon">📦</div>
                <div class="dash-stat-value" id="statTotalValue">0</div>
                <div class="dash-stat-label">Total Orders</div>
            </div>
            <div class="dash-stat-card ongoing" id="statOngoing">
                <div class="dash-stat-icon">⏳</div>
                <div class="dash-stat-value" id="statOngoingValue">0</div>
                <div class="dash-stat-label">Ongoing</div>
            </div>
            <div class="dash-stat-card completed" id="statCompleted">
                <div class="dash-stat-icon">✅</div>
                <div class="dash-stat-value" id="statCompletedValue">0</div>
                <div class="dash-stat-label">Completed</div>
            </div>
            <div class="dash-stat-card spent" id="statSpent">
                <div class="dash-stat-icon">💰</div>
                <div class="dash-stat-value" id="statSpentValue">₹0</div>
                <div class="dash-stat-label">Total Spent</div>
            </div>
        </div>
    </section>

    <!-- Filter Tabs -->
    <nav class="dash-filter-nav">
        <div class="dash-filter-container">
            <button class="dash-filter-btn active" data-filter="all" id="filterAll">
                <span class="filter-icon">📋</span>
                <span>All Orders</span>
                <span class="filter-count" id="countAll">0</span>
            </button>
            <button class="dash-filter-btn" data-filter="ongoing" id="filterOngoing">
                <span class="filter-icon">🔄</span>
                <span>Ongoing</span>
                <span class="filter-count" id="countOngoing">0</span>
            </button>
            <button class="dash-filter-btn" data-filter="completed" id="filterCompleted">
                <span class="filter-icon">✅</span>
                <span>Completed</span>
                <span class="filter-count" id="countCompleted">0</span>
            </button>
        </div>
    </nav>

    <!-- Orders List -->
    <main class="dash-orders-section">
        <div class="dash-orders-list" id="ordersList">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- Floating Action - Order More -->
    <a href="/select-canteen" class="dash-fab" id="fabOrderMore" title="Place New Order">
        <span>🍽️</span>
        <span>Order Food</span>
    </a>

    <script>
        // ============================================
        // State
        // ============================================
        let allOrders = [];
        let currentFilter = 'all';
        let registerNumber = '';
        let studentName = '';

        // ============================================
        // Init
        // ============================================
        document.addEventListener('DOMContentLoaded', () => {
            registerNumber = localStorage.getItem('registerNumber');
            studentName = localStorage.getItem('studentName');

            if (!registerNumber || !studentName) {
                window.location.href = '/';
                return;
            }

            document.getElementById('userDisplay').textContent = `${registerNumber} – ${studentName}`;

            fetchOrders();
            setupEventListeners();

            // Auto-refresh every 15 seconds
            setInterval(fetchOrders, 15000);
        });

        // ============================================
        // API
        // ============================================
        async function fetchOrders() {
            try {
                const response = await fetch(`/api/orders/student/${registerNumber}`);
                const data = await response.json();

                if (data.success) {
                    allOrders = data.orders.sort((a, b) =>
                        new Date(b.created_at) - new Date(a.created_at)
                    );
                    updateStats();
                    renderOrders();
                } else {
                    showEmptyState('Failed to load orders');
                }
            } catch (error) {
                console.error('Error fetching orders:', error);
                showEmptyState('Connection error. Please refresh.');
            }
        }

        // ============================================
        // Stats
        // ============================================
        function updateStats() {
            const ongoing = allOrders.filter(o => isOngoing(o));
            const completed = allOrders.filter(o => isCompleted(o));
            const totalSpent = allOrders.reduce((sum, o) => sum + (o.total_amount || 0), 0);

            // Animate counter updates
            animateValue('statTotalValue', allOrders.length);
            animateValue('statOngoingValue', ongoing.length);
            animateValue('statCompletedValue', completed.length);
            document.getElementById('statSpentValue').textContent = `₹${totalSpent}`;

            // Update filter counts
            document.getElementById('countAll').textContent = allOrders.length;
            document.getElementById('countOngoing').textContent = ongoing.length;
            document.getElementById('countCompleted').textContent = completed.length;
        }

        function animateValue(elementId, finalValue) {
            const el = document.getElementById(elementId);
            const current = parseInt(el.textContent) || 0;
            if (current === finalValue) return;
            el.textContent = finalValue;
            el.classList.add('stat-pop');
            setTimeout(() => el.classList.remove('stat-pop'), 300);
        }

        // ============================================
        // Helpers
        // ============================================
        function isOngoing(order) {
            const status = (order.order_status || '').toUpperCase();
            return status === 'PLACED' || status === 'PREPARING' || status === 'READY';
        }

        function isCompleted(order) {
            const status = (order.order_status || '').toUpperCase();
            return status === 'COLLECTED' || status === 'COMPLETED' || status === 'DELIVERED';
        }

        function getStatusInfo(status) {
            const s = (status || '').toUpperCase();
            switch (s) {
                case 'PLACED':
                    return { label: 'Order Placed', class: 'status-placed', icon: '📝' };
                case 'PREPARING':
                    return { label: 'Preparing', class: 'status-preparing', icon: '👨‍🍳' };
                case 'READY':
                    return { label: 'Ready for Pickup', class: 'status-ready', icon: '🔔' };
                case 'COLLECTED':
                    return { label: 'Collected', class: 'status-collected', icon: '✅' };
                case 'COMPLETED':
                    return { label: 'Completed', class: 'status-completed', icon: '✅' };
                case 'DELIVERED':
                    return { label: 'Delivered', class: 'status-completed', icon: '✅' };
                default:
                    return { label: status || 'Unknown', class: 'status-placed', icon: '📋' };
            }
        }

        function getPaymentInfo(order) {
            const ps = (order.payment_status || '').toUpperCase();
            if (ps === 'PAID') {
                return { label: 'Paid', class: 'pay-paid', icon: '💳' };
            }
            return { label: 'Pending', class: 'pay-pending', icon: '⏳' };
        }

        function formatDateTime(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const diff = now - date;
            const oneDay = 24 * 60 * 60 * 1000;

            const timeStr = date.toLocaleTimeString('en-IN', {
                hour: '2-digit', minute: '2-digit', hour12: true
            });

            // Today
            if (date.toDateString() === now.toDateString()) {
                return `Today, ${timeStr}`;
            }

            // Yesterday
            const yesterday = new Date(now.getTime() - oneDay);
            if (date.toDateString() === yesterday.toDateString()) {
                return `Yesterday, ${timeStr}`;
            }

            // Within a week
            if (diff < 7 * oneDay) {
                const dayName = date.toLocaleDateString('en-IN', { weekday: 'long' });
                return `${dayName}, ${timeStr}`;
            }

            // Older
            return date.toLocaleDateString('en-IN', {
                day: '2-digit', month: 'short', year: 'numeric'
            }) + `, ${timeStr}`;
        }

        function formatFullDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', {
                weekday: 'short',
                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            });
        }

        // ============================================
        // Rendering
        // ============================================
        function renderOrders() {
            const container = document.getElementById('ordersList');
            let filtered = allOrders;

            if (currentFilter === 'ongoing') {
                filtered = allOrders.filter(o => isOngoing(o));
            } else if (currentFilter === 'completed') {
                filtered = allOrders.filter(o => isCompleted(o));
            }

            if (filtered.length === 0) {
                const messages = {
                    all: { icon: '📭', title: 'No orders yet', sub: 'Place your first order to see it here!' },
                    ongoing: { icon: '☕', title: 'No ongoing orders', sub: 'All your orders have been completed.' },
                    completed: { icon: '🍽️', title: 'No completed orders', sub: 'Your completed orders will appear here.' }
                };
                const msg = messages[currentFilter];
                container.innerHTML = `
                    <div class="dash-empty-state">
                        <div class="dash-empty-icon">${msg.icon}</div>
                        <h3>${msg.title}</h3>
                        <p>${msg.sub}</p>
                        <a href="/select-canteen" class="dash-empty-btn">
                            <span>🍽️</span> Order Now
                        </a>
                    </div>
                `;
                return;
            }

            // Group by date
            const grouped = {};
            filtered.forEach(order => {
                const date = new Date(order.created_at);
                const key = date.toDateString();
                if (!grouped[key]) grouped[key] = { date, orders: [] };
                grouped[key].orders.push(order);
            });

            let html = '';
            for (const [key, group] of Object.entries(grouped)) {
                const now = new Date();
                let dateLabel;
                if (group.date.toDateString() === now.toDateString()) {
                    dateLabel = 'Today';
                } else {
                    const yesterday = new Date(now.getTime() - 86400000);
                    if (group.date.toDateString() === yesterday.toDateString()) {
                        dateLabel = 'Yesterday';
                    } else {
                        dateLabel = group.date.toLocaleDateString('en-IN', {
                            weekday: 'long', day: '2-digit', month: 'short', year: 'numeric'
                        });
                    }
                }

                html += `<div class="dash-date-group">
                    <div class="dash-date-header">
                        <span class="dash-date-label">${dateLabel}</span>
                        <span class="dash-date-count">${group.orders.length} order${group.orders.length > 1 ? 's' : ''}</span>
                    </div>`;

                group.orders.forEach((order, index) => {
                    const statusInfo = getStatusInfo(order.order_status);
                    const paymentInfo = getPaymentInfo(order);
                    const isActive = isOngoing(order);
                    const time = new Date(order.created_at).toLocaleTimeString('en-IN', {
                        hour: '2-digit', minute: '2-digit', hour12: true
                    });

                    const itemsSummary = order.items.map(i =>
                        `${i.emoji || '🍽️'} ${i.name} × ${i.quantity}`
                    ).join(', ');

                    const shortItems = order.items.slice(0, 3).map(i =>
                        `<span class="dash-item-chip">${i.emoji || '🍽️'} ${i.name} <span class="chip-qty">×${i.quantity}</span></span>`
                    ).join('');
                    const moreCount = order.items.length > 3 ? order.items.length - 3 : 0;

                    html += `
                    <div class="dash-order-card ${isActive ? 'active-order' : 'completed-order'}" 
                         data-order-id="${order.id}"
                         style="animation-delay: ${index * 0.05}s">
                        <div class="dash-order-top">
                            <div class="dash-order-left">
                                <div class="dash-order-id">#${order.id.toUpperCase()}</div>
                                <div class="dash-order-time">
                                    <span class="time-icon">🕐</span>
                                    <span>${time}</span>
                                </div>
                            </div>
                            <div class="dash-order-right">
                                <span class="dash-status-badge ${statusInfo.class}">
                                    <span>${statusInfo.icon}</span>
                                    <span>${statusInfo.label}</span>
                                </span>
                            </div>
                        </div>
                        
                        <div class="dash-order-middle">
                            <div class="dash-order-canteen">
                                <span class="canteen-icon">🏪</span>
                                <span>${order.canteen_name || 'Canteen'}</span>
                            </div>
                            <div class="dash-order-items-chips">
                                ${shortItems}
                                ${moreCount > 0 ? `<span class="dash-item-chip more">+${moreCount} more</span>` : ''}
                            </div>
                        </div>

                        <div class="dash-order-bottom">
                            <div class="dash-order-amount">₹${order.total_amount}</div>
                            <div class="dash-order-payment ${paymentInfo.class}">
                                <span>${paymentInfo.icon}</span>
                                <span>${paymentInfo.label}</span>
                            </div>
                        </div>

                        ${isActive ? `
                        <div class="dash-order-progress">
                            <div class="progress-track">
                                <div class="progress-step done">
                                    <div class="step-dot"></div>
                                    <span>Placed</span>
                                </div>
                                <div class="progress-line ${order.order_status === 'PREPARING' || order.order_status === 'READY' ? 'done' : ''}"></div>
                                <div class="progress-step ${order.order_status === 'PREPARING' || order.order_status === 'READY' ? 'done' : ''}">
                                    <div class="step-dot"></div>
                                    <span>Preparing</span>
                                </div>
                                <div class="progress-line ${order.order_status === 'READY' ? 'done' : ''}"></div>
                                <div class="progress-step ${order.order_status === 'READY' ? 'done' : ''}">
                                    <div class="step-dot"></div>
                                    <span>Ready</span>
                                </div>
                            </div>
                        </div>` : ''}
                    </div>`;
                });

                html += `</div>`;
            }

            container.innerHTML = html;
        }

        function showEmptyState(message) {
            document.getElementById('ordersList').innerHTML = `
                <div class="dash-empty-state">
                    <div class="dash-empty-icon">😕</div>
                    <h3>${message}</h3>
                    <p>Please try again later</p>
                </div>
            `;
        }

        // ============================================
        // Event Listeners
        // ============================================
        function setupEventListeners() {
            // Filter tabs
            document.querySelectorAll('.dash-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.dash-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderOrders();
                });
            });

            // Logout
            document.getElementById('userInfo').addEventListener('click', () => {
                if (confirm('Do you want to logout?')) {
                    localStorage.clear();
                    window.location.href = '/';
                }
            });

            // Click on order card to view receipt
            document.getElementById('ordersList').addEventListener('click', (e) => {
                const card = e.target.closest('.dash-order-card');
                if (card) {
                    const orderId = card.dataset.orderId;
                    if (orderId) {
                        localStorage.setItem('lastOrderId', orderId);
                        // Find the full order to store
                        const order = allOrders.find(o => o.id === orderId);
                        if (order) {
                            localStorage.setItem('lastOrder', JSON.stringify(order));
                            localStorage.setItem('lastCanteenName', order.canteen_name || '');
                            localStorage.setItem('lastCanteenId', order.canteen_id || '');
                        }
                        window.location.href = `/receipt?order_id=${orderId}`;
                    }
                }
            });
        }
    </script>

        }

        /* Order Card - Middle */
        .dash-order-middle {
            padding: var(--space-md) var(--space-lg);
        }

        .dash-order-canteen {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: var(--space-sm);
        }

        .canteen-icon {
            font-size: 0.875rem;
        }

        .dash-order-items-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .dash-item-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: var(--gray-700);
            font-weight: 500;
        }

        .chip-qty {
            color: var(--gray-400);
            font-weight: 600;
        }

        .dash-item-chip.more {
            background: var(--primary-50);
            border-color: var(--primary-200);
            color: var(--primary-600);
            font-weight: 600;
        }

        /* Order Card - Bottom */
        .dash-order-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) var(--space-lg);
            background: var(--gray-50);
            border-top: 1px solid var(--gray-100);
        }

        .dash-order-amount {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--gray-900);
        }

        .dash-order-payment {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-full);
        }

        .dash-order-payment.pay-paid {
            background: var(--success-light);
            color: var(--success);
        }

        .dash-order-payment.pay-pending {
            background: var(--warning-light);
            color: var(--warning);
        }

        /* ---- Progress Track ---- */
        .dash-order-progress {
            padding: var(--space-md) var(--space-lg) var(--space-lg);
            border-top: 1px dashed var(--gray-200);
        }

        .progress-track {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .progress-step span {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .step-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gray-200);
            border: 2px solid var(--gray-300);
            transition: all var(--transition-normal);
        }

        .progress-step.done .step-dot {
            background: var(--primary-500);
            border-color: var(--primary-500);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .progress-step.done span {
            color: var(--primary-600);
        }

        .progress-line {
            flex: 1;
            height: 3px;
            background: var(--gray-200);
            margin: 0 6px;
            margin-bottom: 22px;
            border-radius: 2px;
            transition: all var(--transition-normal);
        }

        .progress-line.done {
            background: var(--primary-500);
        }

        /* ---- Empty State ---- */
        .dash-empty-state {
            text-align: center;
            padding: var(--space-3xl) var(--space-lg);
            background: white;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-card);
        }

        .dash-empty-icon {
            font-size: 4rem;
            margin-bottom: var(--space-md);
        }

        .dash-empty-state h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: var(--space-sm);
        }

        .dash-empty-state p {
            color: var(--gray-500);
            font-size: 0.9375rem;
            margin-bottom: var(--space-xl);
        }

        .dash-empty-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-xl);
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-md);
            transition: all var(--transition-normal);
        }

        .dash-empty-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        /* ---- Floating Action Button ---- */
        .dash-fab {
            position: fixed;
            bottom: var(--space-xl);
            right: var(--space-xl);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-xl);
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9375rem;
            border-radius: var(--radius-full);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
            transition: all var(--transition-normal);
            z-index: 100;
        }

        .dash-fab:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.5);
        }

        /* ---- Mobile Responsiveness ---- */
        @media (max-width: 480px) {
            .dash-stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-sm);
            }

            .dash-stat-icon {
                font-size: 1.25rem;
            }

            .dash-stat-value {
                font-size: 1.25rem;
            }

            .dash-order-top {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-sm);
            }

            .dash-order-left {
                width: 100%;
                justify-content: space-between;
            }

            .dash-fab {
                bottom: var(--space-lg);
                right: var(--space-lg);
                padding: var(--space-sm) var(--space-lg);
                font-size: 0.875rem;
            }

            .header-logo {
                gap: var(--space-xs);
            }

            .back-link {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }

            .header-logo-icon {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }

            .user-info {
                font-size: 0.75rem;
                padding: var(--space-xs) var(--space-sm);
            }

            .header-title {
                font-size: 1rem;
            }
        }

        @media (max-width: 360px) {
            .dash-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .dash-filter-btn span:not(.filter-icon):not(.filter-count) {
                font-size: 0.75rem;
            }
        }
    </style>
</body>

</html>
