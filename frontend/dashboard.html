<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Your order history and dashboard - Sathyabama Canteen">
    <title>My Orders - Sathyabama Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="dashboard-page">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <a href="/select-canteen" class="back-link" title="Back to Canteens">
                    <span class="back-arrow">←</span>
                </a>
                <div class="header-logo-icon">🍽️</div>
                <span class="header-title">My Orders</span>
            </div>
            <div class="user-info" id="userInfo" style="cursor:pointer;" title="Click to logout">
                <span class="icon">🎓</span>
                <span id="userDisplay">Loading...</span>
            </div>
        </div>
    </header>

    <!-- Dashboard Stats -->
    <section class="dash-stats-section">
        <div class="dash-stats-grid">
            <div class="dash-stat-card" id="statTotal">
                <div class="dash-stat-icon">📦</div>
                <div class="dash-stat-value" id="statTotalValue">0</div>
                <div class="dash-stat-label">Total Orders</div>
            </div>
            <div class="dash-stat-card ongoing" id="statOngoing">
                <div class="dash-stat-icon">⏳</div>
                <div class="dash-stat-value" id="statOngoingValue">0</div>
                <div class="dash-stat-label">Ongoing</div>
            </div>
            <div class="dash-stat-card completed" id="statCompleted">
                <div class="dash-stat-icon">✅</div>
                <div class="dash-stat-value" id="statCompletedValue">0</div>
                <div class="dash-stat-label">Completed</div>
            </div>
            <div class="dash-stat-card spent" id="statSpent">
                <div class="dash-stat-icon">💰</div>
                <div class="dash-stat-value" id="statSpentValue">₹0</div>
                <div class="dash-stat-label">Total Spent</div>
            </div>
        </div>
    </section>

    <!-- Filter Tabs -->
    <nav class="dash-filter-nav">
        <div class="dash-filter-container">
            <button class="dash-filter-btn active" data-filter="all" id="filterAll">
                <span class="filter-icon">📋</span>
                <span>All Orders</span>
                <span class="filter-count" id="countAll">0</span>
            </button>
            <button class="dash-filter-btn" data-filter="ongoing" id="filterOngoing">
                <span class="filter-icon">🔄</span>
                <span>Ongoing</span>
                <span class="filter-count" id="countOngoing">0</span>
            </button>
            <button class="dash-filter-btn" data-filter="completed" id="filterCompleted">
                <span class="filter-icon">✅</span>
                <span>Completed</span>
                <span class="filter-count" id="countCompleted">0</span>
            </button>
        </div>
    </nav>

    <!-- Orders List -->
    <main class="dash-orders-section">
        <div class="dash-orders-list" id="ordersList">
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <!-- Floating Action - Order More -->
    <a href="/select-canteen" class="dash-fab" id="fabOrderMore" title="Place New Order">
        <span>🍽️</span>
        <span>Order Food</span>
    </a>

    <script src="js/dashboard.js"></script>

    <style>
        /* ============================================
           Dashboard Page - Premium Design
           ============================================ */
        .dashboard-page {
            background: var(--gray-50);
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* Back link */
        .back-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            text-decoration: none;
            color: white;
            font-size: 1.125rem;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ---- Stats Section ---- */
        .dash-stats-section {
            background: var(--gradient-dark);
            padding: var(--space-lg) var(--space-lg) var(--space-xl);
            margin-top: -1px;
        }

        .dash-stats-grid {
            max-width: 700px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: var(--space-sm);
        }

        .dash-stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-xl);
            padding: var(--space-md) var(--space-sm);
            text-align: center;
            transition: all var(--transition-normal);
        }

        .dash-stat-card:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .dash-stat-icon {
            font-size: 1.5rem;
            margin-bottom: var(--space-xs);
        }

        .dash-stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: white;
            line-height: 1.2;
        }

        .dash-stat-label {
            font-size: 0.6875rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            margin-top: 2px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .stat-pop {
            animation: statPop 0.3s ease;
        }

        @keyframes statPop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        /* ---- Filter Tabs ---- */
        .dash-filter-nav {
            background: white;
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--gray-200);
            position: sticky;
            top: 60px;
            z-index: 90;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .dash-filter-nav::-webkit-scrollbar {
            display: none;
        }

        .dash-filter-container {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            gap: var(--space-sm);
        }

        .dash-filter-btn {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: var(--space-sm) var(--space-md);
            font-size: 0.8125rem;
            font-weight: 600;
            font-family: inherit;
            color: var(--gray-600);
            background: var(--gray-100);
            border: 2px solid transparent;
            border-radius: var(--radius-full);
            cursor: pointer;
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .dash-filter-btn:hover {
            background: var(--gray-200);
        }

        .dash-filter-btn.active {
            color: var(--primary-700);
            background: var(--primary-50);
            border-color: var(--primary-200);
        }

        .filter-icon {
            font-size: 0.875rem;
        }

        .filter-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 20px;
            height: 20px;
            padding: 0 6px;
            font-size: 0.6875rem;
            font-weight: 700;
            background: var(--gray-200);
            color: var(--gray-600);
            border-radius: var(--radius-full);
        }

        .dash-filter-btn.active .filter-count {
            background: var(--primary-200);
            color: var(--primary-700);
        }

        /* ---- Orders List ---- */
        .dash-orders-section {
            max-width: 700px;
            margin: 0 auto;
            padding: var(--space-lg);
        }

        .dash-orders-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        /* Date Groups */
        .dash-date-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .dash-date-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 var(--space-xs);
        }

        .dash-date-label {
            font-size: 0.8125rem;
            font-weight: 700;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .dash-date-count {
            font-size: 0.75rem;
            color: var(--gray-400);
            font-weight: 500;
        }

        /* ---- Order Card ---- */
        .dash-order-card {
            background: white;
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: all var(--transition-normal);
            cursor: pointer;
            animation: fadeSlideUp 0.4s ease both;
            border: 2px solid transparent;
        }

        .dash-order-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .dash-order-card.active-order {
            border-color: var(--primary-200);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.12);
        }

        .dash-order-card.active-order:hover {
            border-color: var(--primary-300);
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.18);
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Order Card - Top Row */
        .dash-order-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) var(--space-lg);
            border-bottom: 1px solid var(--gray-100);
        }

        .dash-order-left {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .dash-order-id {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            font-weight: 800;
            color: var(--gray-900);
            letter-spacing: 0.03em;
        }

        .dash-order-time {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8125rem;
            color: var(--gray-400);
            font-weight: 500;
        }

        .time-icon {
            font-size: 0.75rem;
        }

        /* Status Badge */
        .dash-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .dash-status-badge.status-placed {
            background: #fef3c7;
            color: #d97706;
        }

        .dash-status-badge.status-preparing {
            background: #e0e7ff;
            color: #4f46e5;
        }

        .dash-status-badge.status-ready {
            background: #d1fae5;
            color: #059669;
        }

        .dash-status-badge.status-collected,
        .dash-status-badge.status-completed {
            background: var(--gray-100);
            color: var(--gray-500);
        }

        /* Order Card - Middle */
        .dash-order-middle {
            padding: var(--space-md) var(--space-lg);
        }

        .dash-order-canteen {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: var(--space-sm);
        }

        .canteen-icon {
            font-size: 0.875rem;
        }

        .dash-order-items-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .dash-item-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            color: var(--gray-700);
            font-weight: 500;
        }

        .chip-qty {
            color: var(--gray-400);
            font-weight: 600;
        }

        .dash-item-chip.more {
            background: var(--primary-50);
            border-color: var(--primary-200);
            color: var(--primary-600);
            font-weight: 600;
        }

        /* Order Card - Bottom */
        .dash-order-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) var(--space-lg);
            background: var(--gray-50);
            border-top: 1px solid var(--gray-100);
        }

        .dash-order-amount {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--gray-900);
        }

        .dash-order-payment {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-full);
        }

        .dash-order-payment.pay-paid {
            background: var(--success-light);
            color: var(--success);
        }

        .dash-order-payment.pay-pending {
            background: var(--warning-light);
            color: var(--warning);
        }

        /* ---- Progress Track ---- */
        .dash-order-progress {
            padding: var(--space-md) var(--space-lg) var(--space-lg);
            border-top: 1px dashed var(--gray-200);
        }

        .progress-track {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .progress-step span {
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--gray-400);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .step-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gray-200);
            border: 2px solid var(--gray-300);
            transition: all var(--transition-normal);
        }

        .progress-step.done .step-dot {
            background: var(--primary-500);
            border-color: var(--primary-500);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
        }

        .progress-step.done span {
            color: var(--primary-600);
        }

        .progress-line {
            flex: 1;
            height: 3px;
            background: var(--gray-200);
            margin: 0 6px;
            margin-bottom: 22px;
            border-radius: 2px;
            transition: all var(--transition-normal);
        }

        .progress-line.done {
            background: var(--primary-500);
        }

        /* ---- Empty State ---- */
        .dash-empty-state {
            text-align: center;
            padding: var(--space-3xl) var(--space-lg);
            background: white;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-card);
        }

        .dash-empty-icon {
            font-size: 4rem;
            margin-bottom: var(--space-md);
        }

        .dash-empty-state h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: var(--space-sm);
        }

        .dash-empty-state p {
            color: var(--gray-500);
            font-size: 0.9375rem;
            margin-bottom: var(--space-xl);
        }

        .dash-empty-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-xl);
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: var(--radius-full);
            box-shadow: var(--shadow-md);
            transition: all var(--transition-normal);
        }

        .dash-empty-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        /* ---- Floating Action Button ---- */
        .dash-fab {
            position: fixed;
            bottom: var(--space-xl);
            right: var(--space-xl);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-md) var(--space-xl);
            background: var(--gradient-primary);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9375rem;
            border-radius: var(--radius-full);
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
            transition: all var(--transition-normal);
            z-index: 100;
        }

        .dash-fab:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.5);
        }

        /* ---- Mobile Responsiveness ---- */
        @media (max-width: 480px) {
            .dash-stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: var(--space-sm);
            }

            .dash-stat-icon {
                font-size: 1.25rem;
            }

            .dash-stat-value {
                font-size: 1.25rem;
            }

            .dash-order-top {
                flex-direction: column;
                align-items: flex-start;
                gap: var(--space-sm);
            }

            .dash-order-left {
                width: 100%;
                justify-content: space-between;
            }

            .dash-fab {
                bottom: var(--space-lg);
                right: var(--space-lg);
                padding: var(--space-sm) var(--space-lg);
                font-size: 0.875rem;
            }

            .header-logo {
                gap: var(--space-xs);
            }

            .back-link {
                width: 30px;
                height: 30px;
                font-size: 0.9rem;
            }

            .header-logo-icon {
                width: 30px;
                height: 30px;
                font-size: 1rem;
            }

            .user-info {
                font-size: 0.75rem;
                padding: var(--space-xs) var(--space-sm);
            }

            .header-title {
                font-size: 1rem;
            }
        }

        @media (max-width: 360px) {
            .dash-stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .dash-filter-btn span:not(.filter-icon):not(.filter-count) {
                font-size: 0.75rem;
            }
        }
    </style>
</body>

</html>
