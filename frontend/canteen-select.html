<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your canteen - Sathyabama Canteen">
    <title>Select Canteen - Sathyabama Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>

<body class="canteen-select-page">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <span class="header-title">Sathyabama Canteen</span>
            </div>
            <div style="display:flex; align-items:center; gap:var(--space-sm);">
                <a href="/dashboard" class="my-orders-link" title="My Orders">
                    📋 My Orders
                </a>
                <div class="user-info" id="userInfo" style="cursor:pointer;" title="Click to logout">
                    <span id="userDisplay">Loading...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="canteen-select-main">
        <div class="select-header-text">
            <h1>Choose Your Canteen</h1>
        </div>

        <div class="canteen-cards" id="canteenCards">
            <!-- Cards will be loaded dynamically -->
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <script>
        // Check if logged in
        const registerNumber = localStorage.getItem('registerNumber');
        const studentName = localStorage.getItem('studentName');
        if (!registerNumber || !studentName) {
            window.location.href = '/';
        } else {
            document.getElementById('userDisplay').textContent = `${registerNumber} - ${studentName}`;
        }

        // Logout on user info click
        document.getElementById('userInfo').addEventListener('click', () => {
            if (confirm('Do you want to logout?')) {
                localStorage.clear();
                window.location.href = '/';
            }
        });

        // Load canteens
        async function loadCanteens() {
            try {
                const response = await fetch('/api/canteens');
                const data = await response.json();

                if (data.success) {
                    const container = document.getElementById('canteenCards');
                    const gradients = [
                        'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                        'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                        'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                        'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)'
                    ];

                    container.innerHTML = data.canteens.map((canteen, index) => {
                        const gradient = gradients[index % gradients.length];
                        return `
                            <a href="/menu?canteen=${canteen.id}" class="canteen-card" style="--card-gradient: ${gradient};">
                                <div class="canteen-card-glow"></div>
                                <div class="canteen-card-content">
                                    <h2 class="canteen-card-name">${canteen.name}</h2>
                                    <div class="canteen-card-action">
                                        <span>Select</span>
                                        <span class="arrow">&rarr;</span>
                                    </div>
                                </div>
                            </a>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Error loading canteens:', error);
                document.getElementById('canteenCards').innerHTML = `
                    <div class="empty-state">
                        <h3>Failed to load canteens</h3>
                        <p>Please refresh the page</p>
                    </div>
                `;
            }
        }

        loadCanteens();
    </script>

    <style>
        .canteen-select-page {
            background: var(--gray-50);
            min-height: 100vh;
        }

        .my-orders-link {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: var(--space-sm) var(--space-md);
            background: rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-full);
            font-size: 0.8125rem;
            font-weight: 600;
            color: white;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all var(--transition-fast);
            white-space: nowrap;
        }

        .my-orders-link:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .canteen-select-main {
            max-width: 700px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
        }

        .select-header-text {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .select-header-text h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--gray-900);
        }

        .canteen-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-lg);
        }

        @media (min-width: 600px) {
            .canteen-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .canteen-card {
            position: relative;
            display: block;
            text-decoration: none;
            background: white;
            border-radius: var(--radius-2xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .canteen-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
        }

        .canteen-card-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--card-gradient);
        }

        .canteen-card-content {
            padding: var(--space-xl) var(--space-lg);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-lg);
        }

        .canteen-card-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .canteen-card-action {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-xl);
            background: var(--card-gradient);
            color: white;
            border-radius: var(--radius-full);
            font-size: 0.9375rem;
            font-weight: 600;
            transition: all var(--transition-normal);
        }

        .canteen-card:hover .canteen-card-action {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .canteen-card:hover .arrow {
            transform: translateX(4px);
        }

        .arrow {
            transition: transform var(--transition-fast);
            font-size: 1.125rem;
        }

        @media (max-width: 480px) {
            .select-header-text h1 {
                font-size: 1.375rem;
            }

            .canteen-card-content {
                padding: var(--space-lg) var(--space-md);
            }

            .canteen-card-name {
                font-size: 1.125rem;
            }
        }
    </style>
</body>

</html>
