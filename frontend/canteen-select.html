<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose your canteen - Sathyabama Canteen">
    <title>Select Canteen - Sathyabama Canteen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="static/styles.css">
</head>

<body class="canteen-select-page">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-logo">
                <div class="header-logo-icon">🍽️</div>
                <span class="header-title">Sathyabama Canteen</span>
            </div>
            <div class="user-info" id="userInfo" style="cursor:pointer;" title="Click to logout">
                <span class="icon">🎓</span>
                <span id="userDisplay">Loading...</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="canteen-select-main">
        <div class="select-header-text">
            <h1>Choose Your Canteen</h1>
            <p>Select where you'd like to order from today</p>
        </div>

        <div class="canteen-cards" id="canteenCards">
            <!-- Cards will be loaded dynamically -->
            <div class="loading">
                <div class="spinner"></div>
            </div>
        </div>
    </main>

    <script>
        // Check if logged in
        const registerNumber = localStorage.getItem('registerNumber');
        const studentName = localStorage.getItem('studentName');
        if (!registerNumber || !studentName) {
            window.location.href = '/';
        } else {
            document.getElementById('userDisplay').textContent = `${registerNumber} – ${studentName}`;
        }

        // Logout on user info click
        document.getElementById('userInfo').addEventListener('click', () => {
            if (confirm('Do you want to logout?')) {
                localStorage.clear();
                window.location.href = '/';
            }
        });

        // Load canteens
        async function loadCanteens() {
            try {
                const response = await fetch('/api/canteens');
                const data = await response.json();

                if (data.success) {
                    const container = document.getElementById('canteenCards');
                    const canteenConfig = {
                        'advanced-canteen': {
                            emoji: '⭐',
                            gradient: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                            desc: 'Premium food court with diverse cuisine',
                            features: ['Premium Items', 'Fast Service', 'AC Dining']
                        },
                        'main-canteen': {
                            emoji: '🏠',
                            gradient: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                            desc: 'Your everyday campus dining experience',
                            features: ['Daily Meals', 'Affordable', 'Quick Bites']
                        }
                    };

                    container.innerHTML = data.canteens.map(canteen => {
                        const config = canteenConfig[canteen.id] || {
                            emoji: '🍽️',
                            gradient: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                            desc: 'Campus canteen',
                            features: []
                        };

                        return `
                            <a href="/menu?canteen=${canteen.id}" class="canteen-card" style="--card-gradient: ${config.gradient};">
                                <div class="canteen-card-glow"></div>
                                <div class="canteen-card-content">
                                    <div class="canteen-card-emoji">${config.emoji}</div>
                                    <h2 class="canteen-card-name">${canteen.name}</h2>
                                    <p class="canteen-card-desc">${config.desc}</p>
                                    <div class="canteen-card-features">
                                        ${config.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                                    </div>
                                    <div class="canteen-card-action">
                                        <span>Order Now</span>
                                        <span class="arrow">→</span>
                                    </div>
                                </div>
                            </a>
                        `;
                    }).join('');
                }
            } catch (error) {
                console.error('Error loading canteens:', error);
                document.getElementById('canteenCards').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">😕</div>
                        <h3>Failed to load canteens</h3>
                        <p>Please refresh the page</p>
                    </div>
                `;
            }
        }

        loadCanteens();
    </script>

    <style>
        .canteen-select-page {
            background: var(--gray-50);
            min-height: 100vh;
        }

        .canteen-select-main {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
        }

        .select-header-text {
            text-align: center;
            margin-bottom: var(--space-2xl);
        }

        .select-header-text h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: var(--space-sm);
        }

        .select-header-text p {
            font-size: 1rem;
            color: var(--gray-500);
        }

        .canteen-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-lg);
        }

        @media (min-width: 600px) {
            .canteen-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .canteen-card {
            position: relative;
            display: block;
            text-decoration: none;
            background: white;
            border-radius: var(--radius-2xl);
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .canteen-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        .canteen-card-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: var(--card-gradient);
        }

        .canteen-card-content {
            padding: var(--space-xl) var(--space-lg);
            text-align: center;
        }

        .canteen-card-emoji {
            font-size: 3.5rem;
            margin-bottom: var(--space-md);
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .canteen-card:nth-child(2) .canteen-card-emoji {
            animation-delay: 0.5s;
        }

        .canteen-card-name {
            font-size: 1.375rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: var(--space-sm);
        }

        .canteen-card-desc {
            font-size: 0.9375rem;
            color: var(--gray-500);
            margin-bottom: var(--space-lg);
            line-height: 1.5;
        }

        .canteen-card-features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        .feature-tag {
            padding: var(--space-xs) var(--space-md);
            background: var(--gray-100);
            color: var(--gray-600);
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .canteen-card-action {
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-xl);
            background: var(--card-gradient);
            color: white;
            border-radius: var(--radius-full);
            font-size: 0.9375rem;
            font-weight: 600;
            transition: all var(--transition-normal);
        }

        .canteen-card:hover .canteen-card-action {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .canteen-card:hover .arrow {
            transform: translateX(4px);
        }

        .arrow {
            transition: transform var(--transition-fast);
            font-size: 1.125rem;
        }

        @media (max-width: 480px) {
            .select-header-text h1 {
                font-size: 1.375rem;
            }

            .canteen-card-content {
                padding: var(--space-lg) var(--space-md);
            }

            .canteen-card-emoji {
                font-size: 2.5rem;
            }

            .canteen-card-name {
                font-size: 1.125rem;
            }
        }
    </style>
</body>

</html>
